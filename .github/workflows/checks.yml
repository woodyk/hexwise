name: Check Hexwise sources and evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify source integrity
        run: python3 tools/integrity.py --check
      - name: Check Studio transactions and adapters
        run: python3 -m unittest discover -s studio/tests -v
      - name: Check framework protocol
        run: python3 -m unittest discover -s framework/tests -v
      - name: Check JavaScript syntax and regressions
        run: |
          node --check studio/web/app.js
          node studio/tests/test_ui.js
